# .github/workflows/pipeline.yml
# Replaces local Airflow scheduling. Runs the extract -> load -> dbt pipeline
# every hour on GitHub's servers — free on a public repo.

name: theme-park-pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"   # off-peak minute — far fewer skipped runs
    - cron: "53 * * * *"   # second attempt each hour; snapshots dedupe
                           # naturally via collected_at
jobs:
  ingest-and-transform:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Write GCP service account key
        run: echo '${{ secrets.GCP_SA_KEY }}' > "$RUNNER_TEMP/gcp-key.json"

      - name: Run extract + load
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          BQ_RAW_DATASET: raw
          BQ_ANALYTICS_DATASET: analytics
        run: python run_pipeline.py

      - name: Run dbt models
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
        working-directory: theme_park_dbt
        run: |
          dbt deps
          dbt run --profiles-dir .
          dbt test --profiles-dir .
